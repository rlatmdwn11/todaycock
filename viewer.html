<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f7d57">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="오늘콕">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=4">
  <title>오늘콕 실시간 관람</title>
  <link rel="stylesheet" href="style.css">
  <script src="firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
</head>
<body>
  <main class="screen active">
    <div class="viewer-shell">
      <div class="topbar">
        <button class="icon-btn" onclick="location.href='index.html'">←</button>
        <h2>오늘콕 관람 모드</h2>
        <span></span>
      </div>

      <section class="card" id="joinCard">
        <label for="viewerRoomInput">팀전 코드</label>
        <input id="viewerRoomInput" placeholder="예: KOK-ABCDE">
        <button class="btn primary" id="viewerJoinBtn" style="width:100%;margin-top:10px">관람하기</button>
      </section>

      <section class="card">
        <div id="viewerStatus" class="viewer-empty">팀전 코드를 입력해주세요.</div>

        <div id="viewerContent" class="hidden">
          <div class="viewer-event-head">
            <div>
              <p class="eyebrow" id="viewerOperator">TODAYCOCK 실시간</p>
              <h1 id="viewerEventName">오늘콕 경기</h1>
              <p class="help" id="viewerEventMeta"></p>
            </div>
            <span class="status-badge active">실시간</span>
          </div>

          <div id="viewerScoreboard" class="viewer-scoreboard">
            <div class="viewer-score-team">
              <span id="viewerTeam1Name">팀1</span>
              <strong id="viewerTeam1Wins">0승</strong>
            </div>
            <b>VS</b>
            <div class="viewer-score-team">
              <span id="viewerTeam2Name">팀2</span>
              <strong id="viewerTeam2Wins">0승</strong>
            </div>
          </div>

          <div class="viewer-progress">
            <div class="progress-line">
              <span>전체 진행률</span>
              <span id="viewerProgressText">0 / 0 경기</span>
            </div>
            <div class="progress-track">
              <div class="progress-bar" id="viewerProgressBar"></div>
            </div>
          </div>

          <div class="viewer-round-card">
            <div class="viewer-round-meta">
              <div>
                <h3 id="viewerRoundTitle">현재 라운드</h3>
                <p class="help" id="viewerRoundProgress"></p>
              </div>
            </div>
            <div id="viewerCurrentMatches"></div>
            <details class="viewer-next hidden" id="viewerNextDetails">
              <summary>다음 라운드 보기</summary>
              <div id="viewerNextMatches"></div>
            </details>
          </div>
        </div>
      </section>

      <section class="card hidden" id="viewerAllCard">
        <h3>전체 대진표</h3>
        <div id="viewerAllMatches"></div>
      </section>
    </div>
  </main>

<script>
'use strict';

const $=(id)=>document.getElementById(id);
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db=null;
let activeRef=null;

function init(){
  if(!firebase.apps.length)firebase.initializeApp(window.TODAYCOCK_FIREBASE_CONFIG);
  db=firebase.database();
}
init();

function isTeamMode(data){
  return ['team','fixed'].includes(data.mode);
}
function sideLabel(data,side){
  if(!isTeamMode(data))return side===1?'조 A':'조 B';
  return side===1?(data.eventInfo?.team1||'팀1'):(data.eventInfo?.team2||'팀2');
}
function names(side){
  return (side||[]).map(p=>p.name).join(' / ');
}
function matchStatus(match){
  const done=match.score1!==''&&match.score2!=='';
  const started=match.score1!==''||match.score2!=='';
  return done?'🟢 완료':started?'🟡 진행중':'⚪ 대기';
}
function renderMatch(match){
  const done=match.score1!==''&&match.score2!=='';
  const started=match.score1!==''||match.score2!=='';
  const score=done||started?`${match.score1||0} : ${match.score2||0}`:'VS';
  return `<div class="viewer-match">
    <div class="viewer-match-head">
      <span>${esc(match.court)}코트</span>
      <span>${matchStatus(match)}</span>
    </div>
    <div class="viewer-match-body">
      <div class="viewer-side">${esc(names(match.team1))}</div>
      <div class="viewer-score">${esc(score)}</div>
      <div class="viewer-side">${esc(names(match.team2))}</div>
    </div>
  </div>`;
}

function renderRoom(data){
  if(!data||data.active!==true){
    $('viewerStatus').textContent='공유가 종료되었거나 존재하지 않는 팀전입니다.';
    $('viewerStatus').classList.remove('hidden');
    $('viewerContent').classList.add('hidden');
    $('viewerAllCard').classList.add('hidden');
    return;
  }

  $('viewerStatus').classList.add('hidden');
  $('viewerContent').classList.remove('hidden');
  $('viewerAllCard').classList.remove('hidden');

  const event=data.eventInfo||{};
  const progress=data.progress||{};
  const scoreboard=data.scoreboard||{};
  const rounds=data.schedule||[];
  const currentRoundNumber=Number(data.currentRound||1);
  const currentRound=rounds.find(r=>Number(r.round)===currentRoundNumber)||rounds[0];
  const nextRound=rounds.find(r=>Number(r.round)===currentRoundNumber+1);

  $('viewerOperator').textContent=data.ownerNickname?`${data.ownerNickname} 운영 · TODAYCOCK 실시간`:'TODAYCOCK 실시간';
  $('viewerEventName').textContent=event.name||'오늘콕 경기';
  $('viewerEventMeta').textContent=[event.date,isTeamMode(data)?`${sideLabel(data,1)} vs ${sideLabel(data,2)}`:'모임 내 대진'].filter(Boolean).join(' · ');

  $('viewerScoreboard').classList.toggle('hidden',!isTeamMode(data));
  $('viewerTeam1Name').textContent=sideLabel(data,1);
  $('viewerTeam2Name').textContent=sideLabel(data,2);
  $('viewerTeam1Wins').textContent=`${scoreboard.team1Wins||0}승`;
  $('viewerTeam2Wins').textContent=`${scoreboard.team2Wins||0}승`;

  $('viewerProgressText').textContent=`${progress.completed||0} / ${progress.total||0} 경기`;
  $('viewerProgressBar').style.width=`${progress.percent||0}%`;

  if(currentRound){
    const completed=(currentRound.matches||[]).filter(m=>m.score1!==''&&m.score2!=='').length;
    $('viewerRoundTitle').textContent=`현재 ${currentRound.round}라운드`;
    $('viewerRoundProgress').textContent=`${completed} / ${(currentRound.matches||[]).length}경기 완료`;
    $('viewerCurrentMatches').innerHTML=(currentRound.matches||[]).map(renderMatch).join('');
  }else{
    $('viewerRoundTitle').textContent='현재 라운드';
    $('viewerRoundProgress').textContent='';
    $('viewerCurrentMatches').innerHTML='<div class="viewer-empty">등록된 경기가 없습니다.</div>';
  }

  $('viewerNextDetails').classList.toggle('hidden',!nextRound);
  $('viewerNextMatches').innerHTML=nextRound?(nextRound.matches||[]).map(renderMatch).join(''):'';

  $('viewerAllMatches').innerHTML=rounds.map(round=>`
    <div class="round-block">
      <h4>${esc(round.round)}라운드</h4>
      ${(round.matches||[]).map(renderMatch).join('')}
    </div>`).join('');
}

function joinRoom(){
  const code=$('viewerRoomInput').value.trim().toUpperCase();
  if(!code)return alert('팀전 코드를 입력해주세요.');

  history.replaceState(null,'',`?room=${encodeURIComponent(code)}`);
  $('viewerStatus').textContent='실시간 정보를 불러오는 중입니다.';
  $('viewerStatus').classList.remove('hidden');
  $('viewerContent').classList.add('hidden');
  $('viewerAllCard').classList.add('hidden');

  if(activeRef)activeRef.off();
  activeRef=db.ref(`rooms/${code}`);

  activeRef.on('value',snapshot=>{
    if(!snapshot.exists()){
      $('viewerStatus').textContent='해당 팀전 코드를 찾을 수 없습니다.';
      return;
    }
    renderRoom(snapshot.val());
  },error=>{
    console.error(error);
    $('viewerStatus').textContent='관람 권한이 없거나 공유가 종료되었습니다.';
  });
}

$('viewerJoinBtn').addEventListener('click',joinRoom);
$('viewerRoomInput').addEventListener('keydown',e=>{if(e.key==='Enter')joinRoom()});

const initialRoom=new URLSearchParams(location.search).get('room');
if(initialRoom){
  $('viewerRoomInput').value=initialRoom.toUpperCase();
  joinRoom();
}
</script>
</body>
</html>
